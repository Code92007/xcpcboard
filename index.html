<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 东北 · 南昌 · 河北 榜单汇总</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #222; }

  .header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 18px; font-weight: 700; flex: 1; min-width: 200px; }
  .search-wrap { display: flex; align-items: center; gap: 8px; }
  .search-input { padding: 7px 12px; border: none; border-radius: 20px; font-size: 14px; width: 240px; outline: none; }
  .search-input:focus { box-shadow: 0 0 0 2px #4a9af5; }
  .btn { padding: 7px 16px; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: 600; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #4a9af5; color: #fff; }
  .btn-clear { background: #555; color: #fff; }
  .filter-badge { background: #e74c3c; color: #fff; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 700; display: none; }
  .filter-badge.show { display: inline-block; }

  .tabs { background: #fff; border-bottom: 2px solid #e0e0e0; display: flex; padding: 0 16px; gap: 4px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow-x: auto; }
  .tab { padding: 14px 20px; font-size: 14px; font-weight: 600; cursor: pointer; color: #666; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; flex-shrink: 0; }
  .tab:hover { color: #1a1a2e; }
  .tab.active { color: #4a9af5; border-bottom-color: #4a9af5; }
  .tab-count { display: inline-block; background: #eee; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .tab.active .tab-count { background: #d0e8ff; color: #1a6ec0; }

  .panels { padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .contest-info { background: #fff; border-radius: 10px; padding: 12px 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #555; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .contest-title { font-weight: 700; color: #1a1a2e; font-size: 15px; flex: 1; }
  .contest-meta { display: flex; gap: 16px; flex-wrap: wrap; }

  .stats-bar { background: #fff; border-radius: 10px; padding: 12px 18px; margin-bottom: 12px; display: flex; gap: 24px; flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,.06); font-size: 13px; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-value { font-size: 22px; font-weight: 800; color: #1a1a2e; }
  .stat-label { color: #888; margin-top: 2px; }

  .prob-legend { background: #fff; border-radius: 10px; padding: 12px 18px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.06); align-items: center; }
  .prob-legend-title { font-size: 13px; font-weight: 700; color: #555; margin-right: 4px; }
  .prob-chip { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }

  .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: #f8f9fa; padding: 10px 12px; font-weight: 700; text-align: center; white-space: nowrap; border-bottom: 2px solid #e0e0e0; position: sticky; top: 0; z-index: 5; }
  thead th.left { text-align: left; }
  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .1s; }
  tbody tr:hover { background: #f8fbff; }
  tbody tr.filtered-match { background: #fffbe6; }
  tbody tr.filtered-match:hover { background: #fff5c0; }
  td { padding: 9px 12px; text-align: center; vertical-align: middle; white-space: nowrap; }
  td.left { text-align: left; }

  .rank-cell { font-weight: 800; font-size: 16px; min-width: 44px; }
  .rank-gold { color: #c9900a; }
  .rank-silver { color: #888; }
  .rank-bronze { color: #a0522d; }

  .team-name { font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .org-name { color: #555; font-size: 12px; }
  .members { color: #888; font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

  .score-cell { font-weight: 800; font-size: 15px; }
  .penalty-cell { color: #888; font-size: 12px; }

  .prob-cell { min-width: 52px; }
  .prob-ac { background: #d4edda; border-radius: 6px; padding: 3px 6px; color: #155724; font-weight: 700; font-size: 12px; display: inline-block; }
  .prob-wa { background: #fff0f0; border-radius: 6px; padding: 3px 6px; color: #c0392b; font-size: 12px; display: inline-block; }
  .prob-frozen { background: #fff3cd; border-radius: 6px; padding: 3px 6px; color: #856404; font-size: 12px; display: inline-block; }
  .prob-none { color: #ddd; font-size: 12px; }
  .prob-time { display: block; font-size: 10px; color: #666; margin-top: 1px; }

  .group-tag { display: inline-block; background: #e0e7ff; color: #3730a3; border-radius: 8px; padding: 1px 7px; font-size: 10px; font-weight: 700; margin-left: 4px; }
  .group-tag.unofficial { background: #fde8e8; color: #b91c1c; }

  .no-data { text-align: center; color: #aaa; padding: 40px; font-size: 15px; }

  .loading { text-align: center; padding: 60px; color: #888; font-size: 16px; }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #4a9af5; border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>🏆 2026 东北 · 南昌 · 河北 榜单汇总</h1>
  <div class="search-wrap">
    <input class="search-input" id="globalSearch" type="text" placeholder="输入学校名，如：大连理工大学" autocomplete="off">
    <button class="btn btn-primary" onclick="applySearch()">筛选</button>
    <button class="btn btn-clear" onclick="clearSearch()">清除</button>
    <span class="filter-badge" id="filterBadge"></span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-panel="panel-dongbei" onclick="switchTab(this)">
    东北地区赛<span class="tab-count" id="count-dongbei">…</span>
  </div>
  <div class="tab" data-panel="panel-nanchang" onclick="switchTab(this)">
    南昌邀请赛<span class="tab-count" id="count-nanchang">…</span>
  </div>
  <div class="tab" data-panel="panel-hbcpc" onclick="switchTab(this)">
    河北省赛<span class="tab-count" id="count-hbcpc">…</span>
  </div>
</div>

<div class="panels">
  <div class="panel active" id="panel-dongbei">
    <div class="loading" id="loading-dongbei"><div class="spinner"></div><br>加载东北赛区数据中…</div>
  </div>
  <div class="panel" id="panel-nanchang">
    <div class="loading" id="loading-nanchang"><div class="spinner"></div><br>加载南昌邀请赛数据中…</div>
  </div>
  <div class="panel" id="panel-hbcpc">
    <div class="loading" id="loading-hbcpc"><div class="spinner"></div><br>加载河北省赛数据中…</div>
  </div>
</div>

<script>
const state = {
  dongbei:  { loaded: false, config: null, teams: null, orgs: null, runs: null, standings: null },
  nanchang: { loaded: false, config: null, teams: null, orgs: null, runs: null, standings: null },
  hbcpc:    { loaded: false, data: null, standings: null },
  filter: '',
};

// ── Tab switching ──────────────────────────────
function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(el.dataset.panel).classList.add('active');
}

// ── Search ────────────────────────────────────
document.getElementById('globalSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') applySearch();
});
function applySearch() {
  state.filter = document.getElementById('globalSearch').value.trim();
  const badge = document.getElementById('filterBadge');
  if (state.filter) { badge.textContent = '筛选: ' + state.filter; badge.classList.add('show'); }
  else { badge.classList.remove('show'); }
  if (state.dongbei.loaded)  renderXCPCIO('dongbei');
  if (state.nanchang.loaded) renderXCPCIO('nanchang');
  if (state.hbcpc.loaded)    renderHBCPC();
}
function clearSearch() {
  document.getElementById('globalSearch').value = '';
  state.filter = '';
  document.getElementById('filterBadge').classList.remove('show');
  if (state.dongbei.loaded)  renderXCPCIO('dongbei');
  if (state.nanchang.loaded) renderXCPCIO('nanchang');
  if (state.hbcpc.loaded)    renderHBCPC();
}

// ── Fetch helper ───────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
  return r.json();
}

// ── XCPCIO loader ──────────────────────────────
async function loadXCPCIO(key, base) {
  try {
    const [config, teams, orgs, runs] = await Promise.all([
      fetchJSON(base + '/config'),
      fetchJSON(base + '/team'),
      fetchJSON(base + '/orgs'),
      fetchJSON(base + '/run'),
    ]);
    state[key].config = config;
    state[key].teams  = teams;
    state[key].orgs   = orgs;
    state[key].runs   = runs;
    state[key].standings = computeXCPCIOStandings(config, teams, orgs, runs);
    state[key].loaded = true;
    renderXCPCIO(key);
  } catch (e) {
    document.getElementById('loading-' + key).innerHTML = '❌ 加载失败: ' + e.message;
  }
}

function getText(n) {
  if (!n) return '';
  if (typeof n === 'string') return n;
  const t = n.texts || {};
  return t['zh-CN'] || t['en'] || '';
}

function computeXCPCIOStandings(config, teams, orgs, runs) {
  const orgMap = Object.fromEntries(orgs.map(o => [o.id, o.name]));
  const problems = config.problem_id;
  const numP = problems.length;
  const duration = config.end_time - config.start_time; // ms
  const frozenAt = duration - config.frozen_time * 1000;
  const penaltyMs = config.penalty * 1000;

  const teamMap = {};
  for (const t of teams) {
    teamMap[t.id] = {
      id: t.id,
      name: getText(t.name),
      org: orgMap[t.organization_id] || t.organization_id || '',
      group: t.group || [],
      members: (t.members || []).map(m => getText(m.name)).filter(Boolean),
      location: t.location || '',
      probs: Array.from({length: numP}, () => ({solved:false, wa:0, solveTime:null, frozen:false, frozenWA:0})),
    };
  }

  for (const run of [...runs].sort((a, b) => a.timestamp - b.timestamp)) {
    const tm = teamMap[run.team_id];
    if (!tm) continue;
    const pi = run.problem_id;
    if (pi < 0 || pi >= numP) continue;
    const p = tm.probs[pi];
    if (p.solved) continue;
    const frozen = run.timestamp >= frozenAt;
    if (run.status === 'ACCEPTED') {
      if (frozen) { p.frozen = true; p.frozenWA++; }
      else { p.solved = true; p.solveTime = run.timestamp; }
    } else {
      if (frozen) p.frozenWA++; else p.wa++;
    }
  }

  const rows = Object.values(teamMap).map(t => {
    let solved = 0, penalty = 0;
    const probStatus = t.probs.map(p => {
      if (p.solved) {
        solved++; penalty += p.solveTime + p.wa * penaltyMs;
        return { state: 'ac', time: p.solveTime, wa: p.wa };
      } else if (p.frozen) return { state: 'frozen', wa: p.wa, frozenWA: p.frozenWA };
      else if (p.wa > 0)   return { state: 'wa', wa: p.wa };
      else                  return { state: 'none' };
    });
    return { ...t, solved, penalty, probStatus };
  });

  const official   = rows.filter(r => r.group.includes('official')).sort(cmpStanding);
  const unofficial = rows.filter(r => !r.group.includes('official')).sort(cmpStanding);
  let rank = 1;
  for (const r of official)   { r.rank = rank++; r.unofficial = false; }
  for (const r of unofficial) { r.rank = null;   r.unofficial = true; }
  return [...official, ...unofficial];
}

function cmpStanding(a, b) {
  if (b.solved !== a.solved) return b.solved - a.solved;
  return a.penalty - b.penalty;
}

// ── CSGRANDEUR loader ──────────────────────────
const CSG_AC = 4;

async function loadHBCPC() {
  try {
    const data = await fetchJSON('/api/hbcpc/rank');
    state.hbcpc.data = data;
    state.hbcpc.standings = computeCSGStandings(data);
    state.hbcpc.loaded = true;
    renderHBCPC();
  } catch (e) {
    document.getElementById('loading-hbcpc').innerHTML = '❌ 加载失败: ' + e.message;
  }
}

function computeCSGStandings(data) {
  const { contest, team, problem, solution } = data;
  const startMs  = new Date(contest.start_time).getTime();
  const endMs    = new Date(contest.end_time).getTime();
  const frozenAt = endMs - contest.frozen_minute * 60000;
  const penaltyMs = 20 * 60000;

  const problems = [...problem].sort((a, b) => a.num - b.num);
  const numP = problems.length;
  const probIdx = Object.fromEntries(problems.map((p, i) => [p.problem_id, i]));

  const teamMap = {};
  for (const t of team) {
    teamMap[t.team_id] = {
      id: t.team_id, name: t.name, org: t.school,
      members: t.tmember || '', coach: t.coach || '',
      groups: t.group_ids || [], tkind: t.tkind,
      probs: Array.from({length: numP}, () => ({solved:false, wa:0, solveTime:null, frozen:false, frozenWA:0})),
    };
  }

  for (const s of [...solution].sort((a, b) => a.in_date < b.in_date ? -1 : 1)) {
    const tm = teamMap[s.team_id];
    if (!tm) continue;
    const pi = probIdx[s.problem_id];
    if (pi === undefined) continue;
    const p = tm.probs[pi];
    if (p.solved) continue;
    const subMs = new Date(s.in_date).getTime();
    const frozen = subMs >= frozenAt;
    if (s.result === CSG_AC) {
      if (frozen) { p.frozen = true; p.frozenWA++; }
      else { p.solved = true; p.solveTime = subMs - startMs; }
    } else {
      if (frozen) p.frozenWA++; else p.wa++;
    }
  }

  const rows = Object.values(teamMap).map(t => {
    let solved = 0, penalty = 0;
    const probStatus = t.probs.map(p => {
      if (p.solved) {
        solved++; penalty += p.solveTime + p.wa * penaltyMs;
        return { state: 'ac', time: p.solveTime, wa: p.wa };
      } else if (p.frozen) return { state: 'frozen', wa: p.wa, frozenWA: p.frozenWA };
      else if (p.wa > 0)   return { state: 'wa', wa: p.wa };
      else                  return { state: 'none' };
    });
    return { ...t, solved, penalty, probStatus };
  });

  const sorted = rows.sort(cmpStanding);
  let rank = 1;
  for (const r of sorted) r.rank = (r.tkind === 0) ? rank++ : null;
  return sorted;
}

// ── Rendering helpers ──────────────────────────
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}` : `${m}min`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function matches(orgName, teamName) {
  if (!state.filter) return false;
  const q = state.filter.toLowerCase();
  return (orgName||'').toLowerCase().includes(q) || (teamName||'').toLowerCase().includes(q);
}

function probCell(ps) {
  if (ps.state === 'ac')
    return `<div class="prob-ac">✓${ps.wa?'+'+ps.wa:''}<span class="prob-time">${fmtTime(ps.time)}</span></div>`;
  if (ps.state === 'frozen')
    return `<div class="prob-frozen">?${ps.frozenWA?'+'+ps.frozenWA:''}</div>`;
  if (ps.state === 'wa')
    return `<div class="prob-wa">-${ps.wa}</div>`;
  return `<span class="prob-none">·</span>`;
}

function rankClass(r) {
  if (r === 1) return 'rank-gold';
  if (r === 2) return 'rank-silver';
  if (r === 3) return 'rank-bronze';
  return '';
}

// ── Render XCPCIO board ────────────────────────
function renderXCPCIO(key) {
  const { config, standings } = state[key];
  const problems = config.problem_id;
  const colors   = config.balloon_color || [];
  const f = state.filter;
  const visible = f ? standings.filter(r => matches(r.org, r.name)) : standings;

  document.getElementById('count-' + key).textContent =
    f ? `${visible.length}/${standings.length}` : standings.length;

  const allOrgs = [...new Set(standings.map(r => r.org).filter(Boolean))];

  const tbody = standings.map(r => {
    if (f && !matches(r.org, r.name)) return '';
    const hi = f && matches(r.org, r.name);
    return `<tr class="${hi ? 'filtered-match' : ''}">
      <td class="rank-cell ${rankClass(r.rank)}">${r.unofficial ? '<span style="color:#bbb;font-size:11px">*</span>' : (r.rank||'')}</td>
      <td class="left"><div class="team-name">${esc(r.name)}</div>${r.unofficial?'<span class="group-tag unofficial">打星</span>':''}</td>
      <td class="left"><div class="org-name">${esc(r.org)}</div></td>
      <td><div class="members">${esc(r.members.join(' / '))}</div></td>
      <td class="score-cell">${r.solved}</td>
      <td class="penalty-cell">${r.solved>0?fmtTime(r.penalty):'-'}</td>
      ${r.probStatus.map(ps=>`<td class="prob-cell">${probCell(ps)}</td>`).join('')}
    </tr>`;
  }).join('');

  const startDate = new Date(config.start_time).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});

  const html = `
    <div class="contest-info">
      <div class="contest-title">${esc(config.contest_name)}</div>
      <div class="contest-meta">
        <span>🕐 ${startDate}</span>
        <span>封榜 ${config.frozen_time/60}min 前</span>
        <span>罚时 ${config.penalty/60}min</span>
        <span>${problems.length} 题</span>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-value">${standings.length}</div><div class="stat-label">参赛队伍</div></div>
      <div class="stat"><div class="stat-value">${standings.filter(r=>r.solved>0).length}</div><div class="stat-label">开题队伍</div></div>
      <div class="stat"><div class="stat-value">${allOrgs.length}</div><div class="stat-label">参赛学校</div></div>
    </div>
    <div class="prob-legend">
      <span class="prob-legend-title">题目：</span>
      ${problems.map((p,i)=>{const c=colors[i]||{};return `<span class="prob-chip" style="background:${c.background_color||'#eee'};color:${c.color||'#222'}">${p}</span>`;}).join('')}
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>#</th><th class="left">队伍</th><th class="left">学校</th><th>成员</th>
        <th>题数</th><th>罚时</th>
        ${problems.map(p=>`<th>${p}</th>`).join('')}
      </tr></thead>
      <tbody>${tbody || '<tr><td colspan="'+(6+problems.length)+'" class="no-data">无匹配队伍</td></tr>'}</tbody>
    </table></div>`;

  const panel = document.getElementById('panel-' + key);
  panel.innerHTML = html;
}

// ── Render HBCPC ───────────────────────────────
function renderHBCPC() {
  const { data, standings } = state.hbcpc;
  const problems = [...data.problem].sort((a,b)=>a.num-b.num);
  const contest  = data.contest;
  const f = state.filter;
  const visible = f ? standings.filter(r => matches(r.org, r.name)) : standings;
  const allOrgs  = [...new Set(standings.map(r=>r.org).filter(Boolean))];
  const allGroups = [...new Set(standings.flatMap(r=>r.groups))].sort();

  document.getElementById('count-hbcpc').textContent =
    f ? `${visible.length}/${standings.length}` : standings.length;

  const probColors = ['#ffd6fc','#e8f5e9','#ffe62d','#ffcba4','#ffab45','#b4ceff','#ccb8ff','#f55a57','#4894f7','#ae38f2','#4fdb51','#78e4ff','#d4edda'];

  const tbody = standings.map(r => {
    if (f && !matches(r.org, r.name)) return '';
    const hi = f && matches(r.org, r.name);
    const unofficial = r.tkind !== 0;
    return `<tr class="${hi?'filtered-match':''}">
      <td class="rank-cell ${rankClass(r.rank)}">${unofficial?'<span style="color:#bbb;font-size:11px">*</span>':(r.rank||'')}</td>
      <td class="left"><div class="team-name">${esc(r.name)}</div></td>
      <td class="left"><div class="org-name">${esc(r.org)}</div></td>
      <td><div class="members">${esc(r.members)}</div></td>
      <td>${r.groups.map(g=>`<span class="group-tag">${esc(g)}</span>`).join('')}</td>
      <td class="score-cell">${r.solved}</td>
      <td class="penalty-cell">${r.solved>0?fmtTime(r.penalty):'-'}</td>
      ${r.probStatus.map(ps=>`<td class="prob-cell">${probCell(ps)}</td>`).join('')}
    </tr>`;
  }).join('');

  const html = `
    <div class="contest-info">
      <div class="contest-title">${esc(contest.title)}</div>
      <div class="contest-meta">
        <span>🕐 ${contest.start_time}</span>
        <span>封榜 ${contest.frozen_minute}min 前</span>
        <span>${problems.length} 题</span>
        <span>赛区: ${allGroups.join(' / ')}</span>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-value">${standings.length}</div><div class="stat-label">参赛队伍</div></div>
      <div class="stat"><div class="stat-value">${standings.filter(r=>r.solved>0).length}</div><div class="stat-label">开题队伍</div></div>
      <div class="stat"><div class="stat-value">${allOrgs.length}</div><div class="stat-label">参赛学校</div></div>
      <div class="stat"><div class="stat-value">${standings.filter(r=>r.groups.includes('HBCPC')).length}</div><div class="stat-label">河北省队</div></div>
    </div>
    <div class="prob-legend">
      <span class="prob-legend-title">题目：</span>
      ${problems.map((p,i)=>`<span class="prob-chip" style="background:${probColors[i]||'#eee'};color:#333">${String.fromCharCode(65+p.num)} ${esc(p.title)}</span>`).join('')}
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>#</th><th class="left">队伍</th><th class="left">学校</th>
        <th>成员</th><th>赛区</th><th>题数</th><th>罚时</th>
        ${problems.map((p,i)=>`<th>${String.fromCharCode(65+p.num)}</th>`).join('')}
      </tr></thead>
      <tbody>${tbody || '<tr><td colspan="'+(7+problems.length)+'" class="no-data">无匹配队伍</td></tr>'}</tbody>
    </table></div>`;

  document.getElementById('panel-hbcpc').innerHTML = html;
}

</script>
