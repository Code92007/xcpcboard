<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#27785f">
  <meta name="description" content="一起围观 XCPC。关注群友的每一次提交，在多个赛站间自由切换。">
  <title>XCPC Board · 一起看比赛</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="XCPC Board 首页"><span class="brand-icon">▥</span><strong>XCPC<span>BOARD</span></strong><i>一起看比赛</i></a>
    <div class="top-actions"><span class="sync-top" id="syncTop">连接中</span><button id="manageButton" class="quiet">管理赛站 <span>↗</span></button></div>
  </header>
  <main>
    <div class="page-heading"><div><div class="eyebrow">THE CONTEST, TOGETHER</div><h1>每一次 AC，都值得围观<span>.</span></h1><p>给熟悉的队伍留个位置，和群友一起等下一颗气球。</p></div><div class="page-mark">XCPC <span>2026</span></div></div>
    <nav class="station-tabs" id="stationTabs" aria-label="切换赛站"></nav>
    <section class="contest-banner" id="contestBanner"><div class="loading">正在连接赛站…</div></section>
    <section class="video-panel" id="videoPanel" hidden></section>
    <div class="workspace">
      <section class="standings-panel">
        <div class="panel-heading"><div><span class="eyebrow">STANDINGS</span><h2>赛场榜单 <span id="teamCount"></span></h2></div><div class="panel-actions"><button id="groupButton" class="quiet">＋ 关注分组</button><button id="refreshButton" class="icon-button" title="重新读取最新缓存" aria-label="刷新榜单">↻</button></div></div>
        <div class="view-bar"><div id="viewTabs" class="view-tabs"></div><select id="rankGroup" aria-label="原榜排名组"></select></div>
        <div class="table-tools"><label class="search"><span>⌕</span><input id="search" placeholder="搜索队名、学校、群友备注…" autocomplete="off" aria-label="搜索队伍"><kbd>/</kbd></label><span class="legend"><i class="ac-dot"></i>通过 <i class="wa-dot"></i>未通过 <i class="pending-dot"></i>待判 / 封榜</span></div>
        <div id="cacheNotice" class="cache-notice" hidden></div>
        <div class="table-wrap" id="tableWrap"><div class="empty">正在拉取榜单…</div></div>
        <div class="table-footer"><span id="viewInfo">公开排名始终基于所选原榜组</span><span>点 ☆ 关注 · 点备注编辑</span></div>
      </section>
      <aside class="queue-panel">
        <div class="panel-heading"><div><span class="eyebrow">SUBMISSION FEED</span><h2><i class="live-dot"></i>提交队列</h2></div><button id="queuePause" class="icon-button" aria-label="暂停队列动画" title="暂停队列动画">Ⅱ</button></div>
        <div class="queue-controls"><label><input type="checkbox" id="queueOnlyView">仅看当前分组</label><span id="queueTotal">—</span></div>
        <div class="queue-columns"><span>当前排名 / 队伍</span><span>题目 · 结果</span></div>
        <div class="queue" id="queue"><div class="empty">等待比赛数据</div></div>
        <div class="queue-footer"><span id="queueHint">最近提交 · 新提交会依次入队</span><span class="pulse-line"></span></div>
      </aside>
    </div>
    <footer class="site-footer"><span><strong>XCPC BOARD</strong> <span>把关注，留给赛场。</span></span><span>数据来自 <a id="sourceLink" href="https://board.xcpcio.com/" target="_blank" rel="noreferrer">原始榜单 ↗</a> · <a href="/legacy/" target="_blank">往期邀请赛</a> · <a href="https://github.com/Code92007/xcpcboard" target="_blank" rel="noreferrer">GitHub ↗</a></span></footer>
  </main>
  <dialog id="modal"><div class="modal-top"><div><span class="eyebrow" id="modalEyebrow"></span><h2 id="modalTitle"></h2></div><button class="icon-button" id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
